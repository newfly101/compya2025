name: Deploy FE

# web/ 가 바뀐 커밋이 master 에 올라가면 배포한다.
# 다른 브랜치에서 배포하려면 Actions 탭에서 수동 실행(workflow_dispatch).
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-fe.yml'
  workflow_dispatch:

concurrency:
  group: deploy-fe
  cancel-in-progress: false

env:
  BUCKET: compya-images
  DIST_ID: E3TX8OFJBC8IML
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: 빌드 (+ prerender 스냅샷)
        working-directory: web
        run: npm run build:prerender

      - name: 빌드 산출물 확인
        run: test -f web/dist/index.html

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ⚠️ web 정적 파일과 업로드 이미지가 같은 버킷이다.
      #    exclude 두 개가 빠지면 --delete 가 업로드물을 지운다.
      - name: S3 동기화
        run: |
          aws s3 sync web/dist "s3://${BUCKET}" \
            --delete \
            --exclude "uploads/*" \
            --exclude "portfolio/*"

      - name: CloudFront 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/*"
