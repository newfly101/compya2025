name: Deploy BE

# 2026-09-28 SSH 자동 배포 전환 — S3 아티팩트 + SSM 대신 scp 로 jar 업로드,
#   ssh 로 원격 배포 스크립트를 실행한다. 필요 Secrets: EC2_HOST · EC2_USER · EC2_SSH_KEY.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

concurrency:
  group: be-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: compyafun-web
  JAR_NAME: compyafun-web.jar
  MIN_JAR_SIZE_BYTES: 5000000

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Java version from build.gradle
        id: java-version
        run: |
          VERSION=$(grep -oP "JavaLanguageVersion\.of\(\K[0-9]+" build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::build.gradle 에서 Java 버전을 찾지 못했다"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "감지된 Java 버전: $VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java-version.outputs.version }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (clean bootJar)
        run: ./gradlew clean bootJar --no-daemon

      - name: Verify build artifact
        run: |
          JAR_PATH="build/libs/${{ env.JAR_NAME }}"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::빌드 산출물이 없다: $JAR_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$JAR_PATH")
          echo "빌드된 jar 크기: ${SIZE} bytes"
          if [ "$SIZE" -lt "${{ env.MIN_JAR_SIZE_BYTES }}" ]; then
            echo "::error::jar 크기가 비정상적으로 작다 (${SIZE} bytes < ${{ env.MIN_JAR_SIZE_BYTES }})"
            exit 1
          fi

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: jar 업로드 (scp)
        run: |
          scp -i ~/.ssh/deploy_key "build/libs/${{ env.JAR_NAME }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/compyafun-web.jar.new"

      - name: 원격 배포 (ssh)
        run: |
          cat > /tmp/remote-deploy.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          REMOTE_DIR="/opt/compyafun"
          JAR_NAME="compyafun-web.jar"
          SERVICE="compyafun-web"
          TMP_JAR="/tmp/compyafun-web.jar.new"
          STAMP="$(date +%y%m%d-%H%M)"

          if [ ! -s "$TMP_JAR" ]; then
            echo "✖ 업로드된 jar 가 없거나 빈 파일: $TMP_JAR — 기존 jar 유지, 배포 중단"
            exit 1
          fi

          SIZE=$(stat -c%s "$TMP_JAR")
          echo "  업로드된 jar 크기: ${SIZE} bytes"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "✖ jar 크기가 비정상적으로 작다 (${SIZE} bytes) — 기존 jar 유지, 배포 중단"
            exit 1
          fi

          echo "▶ 현재 jar 백업 → bak/compyafun-web-$STAMP.jar"
          sudo cp "$REMOTE_DIR/$JAR_NAME" "$REMOTE_DIR/bak/compyafun-web-$STAMP.jar"

          echo "▶ 교체"
          sudo mv "$TMP_JAR" "$REMOTE_DIR/$JAR_NAME"

          echo "▶ 서비스 재시작"
          sudo systemctl restart "$SERVICE"
          sudo systemctl restart nginx

          echo "▶ 기동 확인 (10초 대기)"
          sleep 10
          STATUS="$(systemctl is-active "$SERVICE" || true)"

          if [ "$STATUS" == "active" ]; then
            echo "  ✔ $SERVICE active"
          else
            echo "  ✖ 기동 실패 (상태: $STATUS)"
            echo "  최근 로그 40줄:"
            sudo journalctl -u "$SERVICE" -n 40 --no-pager
            echo ""
            echo "▶ 롤백하려면 (EC2 상에서 직접)"
            echo "   sudo cp $REMOTE_DIR/bak/compyafun-web-$STAMP.jar $REMOTE_DIR/$JAR_NAME && sudo systemctl restart $SERVICE"
            exit 1
          fi
          REMOTE_SCRIPT

          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' < /tmp/remote-deploy.sh

      - name: SSH 키 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
