# /etc/nginx/conf.d/compyafun-next.conf 예시 — 기존 nginx 설정(BE 프록시)과 server_name 충돌 주의.
upstream compyafun_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name compyafun.com www.compyafun.com;

    # 해시 파일명이라 장기 캐시 안전
    location /_next/static/ {
        proxy_pass http://compyafun_next;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api 는 기존 BE 프록시 설정을 그대로 유지 (여기서 재정의하지 않음)
    # /uploads/* 는 기존 S3 경로 유지 — Next 로 보내지 말 것

    location / {
        proxy_pass http://compyafun_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
